# Intent training examples. Restaurant names are written as "the restaurant": names are replaced the same way
# before classifying ("delexicalization"), so the classifier learns the request, not which restaurants we list.
# Quote "yes" and "no": YAML reads them unquoted as True / False.
ask_reviews:
  - Is the pizza good at the restaurant?
  - How long is the wait at the restaurant?
  - Do people like the service there?
  - Is the restaurant expensive?
  - What do reviewers say about the coffee?
  - Did anyone get food poisoning?
  - Where can I get spicy soup?
  - Who is the chef at the restaurant?
  - Is it clean?
  - Which place is best for a quick lunch?
  - Are the portions big?
  - How is the parking near the restaurant?
summarize:
  - Summarize the reviews of the restaurant
  - Give me an overview of the restaurant
  - What do people think of the restaurant overall?
  - Sum up what customers say about the restaurant
  - Can you give me a summary for the restaurant?
  - Pros and cons of the restaurant?
  - What's the general opinion on the restaurant?
  - Quick summary of the restaurant please
book_table:
  - Book a table at the restaurant
  - I want to reserve a table for two
  - Can I make a reservation for tomorrow at 7?
  - Reserve a table for 4 people on Friday
  - Get me a table at the restaurant tonight
  - I'd like to book dinner for three
  - Make a booking at the restaurant for Saturday
  - Table for two at 8 pm please
greet:
  - hi
  - hello
  - hey there
  - good morning
  - hi, anyone there?
  - hello bot
thanks_bye:
  - thanks
  - thank you, that's helpful
  - bye
  - goodbye
  - thanks, that's all
  - see you later
help:
  - what can you do?
  - help
  - how does this work?
  - what kind of questions can I ask?
  - what are your features?
  - I need help using this
affirm:
  - "yes"
  - yes please
  - that's right
  - correct
  - sure, go ahead
  - yep
deny:
  - "no"
  - no thanks
  - that's wrong
  - cancel it
  - nope
  - don't book it
