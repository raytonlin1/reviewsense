# DPO from thumbs up/down in data/feedback.jsonl (written by the UI and the /feedback endpoint).
merged_output_dir: artifacts/dpo-merged
min_pairs: 20
# ---- trl.ModelConfig
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
use_peft: true
lora_r: 16
lora_alpha: 32
lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
lora_task_type: CAUSAL_LM
# ---- trl.DPOConfig
output_dir: artifacts/dpo-checkpoints
beta: 0.1                          # KL strength: how far the policy may move from the reference model
learning_rate: 5.0e-6
num_train_epochs: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
logging_steps: 5
save_strategy: "no"
report_to: none
seed: 42
