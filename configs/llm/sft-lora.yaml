# LoRA SFT for owner replies. Grow data/owner_replies.jsonl to ~200 human-reviewed rows before a real run.
data: data/owner_replies.jsonl
merged_output_dir: artifacts/sft-merged
# ---- trl.ModelConfig
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
lora_task_type: CAUSAL_LM
# ---- trl.SFTConfig
output_dir: artifacts/sft-checkpoints
num_train_epochs: 3
learning_rate: 2.0e-4              # LoRA tolerates ~10x the full fine-tuning learning rate
per_device_train_batch_size: 4
gradient_accumulation_steps: 4     # effective batch 16
lr_scheduler_type: cosine
warmup_steps: 0.05
max_length: 1024
logging_steps: 10
save_strategy: "no"
report_to: none
seed: 42
